<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinSmart - Savings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>FinSmart Portal</h1>
</header>
<nav>
    <a href="index.html">Home</a>
    <a href="income.html">Income Entry Form</a>
    <a href="savings.html">Savings Calculator</a>
    <a href="reports.html">Monthly Reports</a>
    <a href="budget.html">Budget Planner</a>
    <a href="register.html">Register</a>
</nav>
<main>
<div class="content-box">
<h2 style="color:skyblue;">Savings Calculator</h2>
<form>
<label for="save">Monthly Contribution:</label>
<input
type="number"
id="save"
placeholder="Enter Monthly Saving"
min="0"
required>
<label for="rate">Interest Rate (%):</label>
<input
type="number"
id="rate"
placeholder="Enter Annual Interest Rate"
min="0"
step="0.01"
required>
<button
type="button"
id="calculateBtn"
style="background-color:orange;">
Calculate Future Balance
</button>
</form>
<p style="margin-top:20px;font-size:25px;">
Projected Accumulation:
<span
id="result"
style="color:orange;font-weight:bold;">
₹0.00
</span>
</p>
</div>
</main>
<footer>
<p>&copy; FinSmart</p>
</footer>
<script src="scripts/savings.js"></script>
</body>
</html>
